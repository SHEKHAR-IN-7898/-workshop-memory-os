<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Workshop Memory OS Login</title><style>body{font-family:system-ui;max-width:420px;margin:80px auto;background:#0b1020;color:white;padding:20px}.box{background:#151c31;padding:24px;border-radius:16px}input,button{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;border-radius:8px;border:1px solid #35415f;background:#10172a;color:white}button{cursor:pointer}</style></head><body><div class="box"><h1>Workshop Memory OS</h1><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="out"></p></div><script>async function login(){try{const r=await fetch("/api/v1/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem("wmo_token",d.token);location.href="/dashboard"}catch(e){out.textContent=e.message}}</script></body></html>
